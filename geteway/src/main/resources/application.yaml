server:
  port: 9090

spring:
  application:
    name: apigateway
  cloud:
    gateway:
      # 'server: webmvc' removed. We are now using standard reactive routes.
      routes:
        - id: OrderService
          uri: lb://ORDERSERVICE
          predicates:
            - Path=/api/v1/orders/**
        - id: InventoryService
          uri: lb://INVENTORYSERVICE
          predicates:
            - Path=/api/v1/products/**
      discovery:
        locator:
          enabled: true # Optional: Allows automatic routing based on service name

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true