spring:
  application:
    name:  api-gateway

  #api gateway config

  cloud:
    gateway:
      routes:
        -  id: OrderService
           uri: lb://ORDERSERVICE
           predicates:
             - Path=/api/v1/orders/**
        - id: InventoryService
          uri: lb://INVENTORYSERVICE
          predicates:
            - Path=/api/v1/products/**

    eureka:
      client:
        serviceUrl:
          defaultZone: http://localhost:8761/eureka/




